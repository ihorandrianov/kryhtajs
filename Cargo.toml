[package]
name = "kryhta"
version = "0.1.0"
edition = "2021"
description = "A tiny, safe, no_std JavaScript engine for microcontrollers"
license = "MIT"
keywords = ["javascript", "embedded", "no_std", "interpreter"]
categories = ["embedded", "no-std", "parser-implementations"]

[lib]
name = "kryhta"
path = "src/lib.rs"

[[bin]]
name = "kryhta"
path = "src/bin/kryhta.rs"
required-features = ["std"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dependencies]
libm = "0.2"

[dev-dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
