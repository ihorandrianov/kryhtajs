[package]
name = "kryhta"
version = "0.1.0"
edition = "2024"
description = "A tiny JavaScript engine with algebraic effects"
license = "MIT"
keywords = ["javascript", "interpreter", "effects"]
categories = ["parser-implementations"]

[lib]
name = "kryhta"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kryhta"
path = "src/bin/kryhta.rs"

[features]
default = []
wasm = ["wasm-bindgen", "web-sys"]

[dependencies]
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

[dev-dependencies]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
