[package]
name = "kryhta"
version = "0.1.0"
edition = "2024"
description = "A tiny JavaScript engine with algebraic effects"
license = "MIT"
keywords = ["javascript", "interpreter", "effects"]
categories = ["parser-implementations"]

[lib]
name = "kryhta"
path = "src/lib.rs"

[[bin]]
name = "kryhta"
path = "src/bin/kryhta.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
